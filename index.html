document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

x;animation:fadeUp .5s ease .48s both;\">\n          <div style=\"font-size:12px;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;color:#D4AF37;margin-bottom:14px;\">PREPARANDO ATENDIMENTO<\u002Fdiv>\n          <div style=\"font-size:14px;color:#BFB4AF;\">{{ countdownMessage }}<\u002Fdiv>\n        <\u002Fdiv>\n\n        <button sc-camel-on-click=\"{{ manualRedirect }}\" style=\"width:100%;padding:19px 20px;background:#12A05C;color:#03170D;font-weight:800;font-size:15px;border:none;border-radius:14px;cursor:pointer;margin-bottom:12px;box-shadow:0 12px 30px rgba(18,160,92,0.45);animation:fadeUp .5s ease .58s both;\">FALAR COM O SUPORTE AGORA<\u002Fbutton>\n        <p style=\"font-size:13px;color:#6B7280;margin:0;animation:fadeUp .5s ease .66s both;\">Se preferir, você pode continuar imediatamente pelo botão acima.<\u002Fp>\n\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n  <\u002Fdiv>\n\n  <div style=\"width:100%;border-top:1px solid #211D14;margin-top:24px;\">\n    <div style=\"max-width:460px;margin:0 auto;padding:24px 20px 32px;\">\n      <div ref=\"{{ legalRef }}\" style=\"{{ legalRevealStyle }}\">\n        <p style=\"font-size:11.5px;line-height:1.7;color:#5A6068;margin:0 0 10px;\">Este site não faz parte do Facebook™ ou da Meta Platforms, Inc. e não é endossado, administrado, patrocinado ou associado ao Facebook, Instagram ou à Meta Platforms, Inc. Todas as marcas, nomes comerciais e logotipos mencionados pertencem aos seus respectivos proprietários.<\u002Fp>\n        <p style=\"font-size:11.5px;line-height:1.7;color:#5A6068;margin:0 0 10px;\">A Meta Platforms, Inc., Facebook e Instagram não possuem qualquer responsabilidade sobre o conteúdo, produtos, serviços, informações, ofertas, atendimento, resultados ou operações apresentados neste site.<\u002Fp>\n        <p style=\"font-size:11.5px;line-height:1.7;color:#5A6068;margin:0 0 10px;\">As informações disponibilizadas nesta página são de responsabilidade exclusiva da empresa responsável por esta operação.<\u002Fp>\n      <\u002Fdiv>\n      <div ref=\"{{ securityRef }}\" style=\"{{ securityRevealStyle }}border-top:1px solid #1E1A10;margin:20px 0 22px;padding-top:22px;\">\n        <div style=\"font-size:11px;font-weight:700;letter-spacing:0.1em;color:#6B7280;text-transform:uppercase;text-align:center;margin-bottom:16px;\">Segurança e Jogo Responsável<\u002Fdiv>\n        <div style=\"overflow:hidden;width:100%;mask-image:linear-gradient(90deg,transparent,#000 8%,#000 92%,transparent);\">\n          <div style=\"display:flex;width:max-content;gap:26px;align-items:center;animation:marquee 20s linear infinite reverse;\">\n            <img src=\"a7a072c4-1725-4336-9066-a87d457c2ee8\" style=\"height:32px;width:auto;object-fit:contain;border-radius:4px;flex-shrink:0;\" alt=\"SecureTrust Trusted Ecommerce\">\n            <img src=\"4c0092bd-cc7e-47a7-b529-163e5acbf46c\" style=\"height:40px;width:auto;object-fit:contain;background:#fff;border-radius:6px;padding:3px;flex-shrink:0;\" alt=\"ISO/IEC 27001 Certified\">\n            <img src=\"46601517-a5cc-47a0-8310-8a667f74b3a4\" style=\"height:34px;width:auto;object-fit:contain;flex-shrink:0;\" alt=\"Jogo Responsável\">\n            <img src=\"50bc931d-142e-42fc-b3b9-6bfd7c01f638\" style=\"height:22px;width:auto;object-fit:contain;flex-shrink:0;\" alt=\"IBIA - Safeguarding Sports Betting\">\n            <img src=\"42bad6a7-63fd-43cf-bd69-0af5414fb58b\" style=\"height:26px;width:auto;object-fit:contain;flex-shrink:0;\" alt=\"IBJR - Instituto Brasileiro de Jogo Responsável\">\n            <img src=\"06e51967-add9-4e03-9f05-813902e996cb\" style=\"height:26px;width:auto;object-fit:contain;flex-shrink:0;\" alt=\"Kaizen Gaming\">\n            <img src=\"816b54fc-c350-4775-b23d-31d5fbcd7b0f\" style=\"height:26px;width:auto;object-fit:contain;flex-shrink:0;\" alt=\"GT\">\n            <img src=\"1f8857c9-6cec-4c6b-9a7c-2fed1d485161\" style=\"height:34px;width:auto;object-fit:contain;flex-shrink:0;\" alt=\"Governo Federal Brasil\">\n            <img src=\"4dbef868-7651-46f9-96ca-08519749d047\" style=\"height:56px;width:auto;object-fit:contain;border-radius:6px;border:1px solid #3A3120;flex-shrink:0;\" alt=\"Classificação Indicativa 18 anos - Apostas ou jogos de azar\">\n            <img src=\"a7a072c4-1725-4336-9066-a87d457c2ee8\" style=\"height:32px;width:auto;object-fit:contain;border-radius:4px;flex-shrink:0;\" alt=\"SecureTrust Trusted Ecommerce\">\n            <img src=\"4c0092bd-cc7e-47a7-b529-163e5acbf46c\" style=\"height:40px;width:auto;object-fit:contain;background:#fff;border-radius:6px;padding:3px;flex-shrink:0;\" alt=\"ISO/IEC 27001 Certified\">\n            <img src=\"46601517-a5cc-47a0-8310-8a667f74b3a4\" style=\"height:34px;width:auto;object-fit:contain;flex-shrink:0;\" alt=\"Jogo Responsável\">\n            <img src=\"50bc931d-142e-42fc-b3b9-6bfd7c01f638\" style=\"height:22px;width:auto;object-fit:contain;flex-shrink:0;\" alt=\"IBIA - Safeguarding Sports Betting\">\n            <img src=\"42bad6a7-63fd-43cf-bd69-0af5414fb58b\" style=\"height:26px;width:auto;object-fit:contain;flex-shrink:0;\" alt=\"IBJR - Instituto Brasileiro de Jogo Responsável\">\n            <img src=\"06e51967-add9-4e03-9f05-813902e996cb\" style=\"height:26px;width:auto;object-fit:contain;flex-shrink:0;\" alt=\"Kaizen Gaming\">\n            <img src=\"816b54fc-c350-4775-b23d-31d5fbcd7b0f\" style=\"height:26px;width:auto;object-fit:contain;flex-shrink:0;\" alt=\"GT\">\n            <img src=\"1f8857c9-6cec-4c6b-9a7c-2fed1d485161\" style=\"height:34px;width:auto;object-fit:contain;flex-shrink:0;\" alt=\"Governo Federal Brasil\">\n            <img src=\"4dbef868-7651-46f9-96ca-08519749d047\" style=\"height:56px;width:auto;object-fit:contain;border-radius:6px;border:1px solid #3A3120;flex-shrink:0;\" alt=\"Classificação Indicativa 18 anos - Apostas ou jogos de azar\">\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <p style=\"font-size:11.5px;line-height:1.7;color:#767c85;margin:0 0 12px;font-weight:600;\">CNPJ: 53.837.227/0001-52<\u002Fp>\n      <div style=\"display:flex;flex-direction:column;gap:8px;align-items:flex-start;\">\n        <a sc-camel-on-click=\"{{ goToPrivacy }}\" style=\"font-size:11.5px;color:#D4AF37;text-decoration:underline;cursor:pointer;\">Política de Proteção e Privacidade de Dados Pessoais<\u002Fa>\n        <a sc-camel-on-click=\"{{ goToSac }}\" style=\"font-size:11.5px;color:#D4AF37;text-decoration:underline;cursor:pointer;\">Política de Atendimento ao Cliente — SAC<\u002Fa>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <sc-if value=\"{{ isSac }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"position:fixed;inset:0;background:#0A0908;z-index:20;overflow-y:auto;\">\n      <div style=\"max-width:640px;margin:0 auto;padding:28px 20px 60px;\">\n        <a sc-camel-on-click=\"{{ goBackFromSac }}\" style=\"display:inline-block;margin-bottom:24px;font-size:14px;font-weight:700;color:#D4AF37;cursor:pointer;text-decoration:none;\">← Voltar<\u002Fa>\n        <h1 style=\"font-family:'Archivo',sans-serif;font-weight:900;font-size:24px;color:#fff;margin:0 0 20px;\">Política de Atendimento ao Cliente — SAC<\u002Fh1>\n        <p style=\"font-size:14px;line-height:1.7;color:#BFB4AF;margin:0 0 24px;\">A Métodos Lucrativos mantém canais de atendimento destinados a esclarecer dúvidas, receber solicitações, registrar reclamações e auxiliar clientes em questões relacionadas aos nossos produtos, serviços, pagamentos e acessos.<\u002Fp>\n\n        <div style=\"background:#14120C;border:1px solid #3A3120;border-radius:14px;padding:18px 18px;margin:0 0 28px;display:flex;flex-direction:column;gap:10px;\">\n          <div style=\"font-size:11px;font-weight:800;letter-spacing:0.12em;text-transform:uppercase;color:#D4AF37;\">Canais oficiais<\u002Fdiv>\n          <div style=\"font-size:14px;line-height:1.6;color:#F5F7F8;\"><strong style=\"color:#fff;\">E-mail:<\u002Fstrong> <a href=\"mailto:Sac@metodoslucrativos.com\" style=\"color:#D4AF37;\">Sac@metodoslucrativos.com<\u002Fa><\u002Fdiv>\n          <div style=\"font-size:14px;line-height:1.6;color:#F5F7F8;\"><strong style=\"color:#fff;\">Telefone / WhatsApp:<\u002Fstrong> (11) 92024-8503<\u002Fdiv>\n          <div style=\"font-size:14px;line-height:1.6;color:#F5F7F8;\"><strong style=\"color:#fff;\">Horário:<\u002Fstrong> Todos os dias, das 08:00 às 20:00 (horário de Brasília)<\u002Fdiv>\n          <div style=\"font-size:14px;line-height:1.6;color:#F5F7F8;\"><strong style=\"color:#fff;\">Primeira resposta:<\u002Fstrong> até 24 horas<\u002Fdiv>\n        <\u002Fdiv>\n\n        <h2 style=\"font-family:'Archivo',sans-serif;font-weight:800;font-size:16px;color:#fff;margin:0 0 10px;\">1. Canais oficiais de atendimento<\u002Fh2>\n        <p style=\"font-size:14px;line-height:1.7;color:#BFB4AF;margin:0 0 8px;\">O atendimento ao cliente é realizado pelos seguintes canais:<\u002Fp>\n        <p style=\"font-size:14px;line-height:1.7;color:#BFB4AF;margin:0 0 8px;\"><strong style=\"color:#fff;\">E-mail:<\u002Fstrong> <a href=\"mailto:Sac@metodoslucrativos.com\" style=\"color:#D4AF37;\">Sac@metodoslucrativos.com<\u002Fa><br><strong style=\"color:#fff;\">Telefone / WhatsApp:<\u002Fstrong> (11) 92024-8503<\u002Fp>\n        <p style=\"font-size:14px;line-height:1.7;color:#BFB4AF;margin:0 0 20px;\">Para sua segurança, recomendamos que solicitações envolvendo dados pessoais, pagamentos ou informações de acesso sejam realizadas exclusivamente pelos canais oficiais informados nesta página.<\u002Fp>\n\n        <h2 style=\"font-family:'Archivo',sans-serif;font-weight:800;font-size:16px;color:#fff;margin:0 0 10px;\">2. Horário de atendimento<\u002Fh2>\n        <p style=\"font-size:14px;line-height:1.7;color:#BFB4AF;margin:0 0 8px;\">Nosso horário de atendimento é:<\u002Fp>\n        <p style=\"font-size:14px;line-height:1.7;color:#BFB4AF;margin:0 0 8px;\"><strong style=\"color:#fff;\">Todos os dias, das 08:00 às 20:00, horário de Brasília.<\u002Fstrong><\u002Fp>\n        <p style=\"font-size:14px;line-height:1.7;color:#BFB4AF;margin:0 0 20px;\">Mensagens enviadas fora desse horário serão registradas e analisadas no próximo período de atendimento.<\u002Fp>\n\n        <h2 style=\"font-family:'Archivo',sans-serif;font-weight:800;font-size:16px;color:#fff;margin:0 0 10px;\">3. Prazo de resposta<\u002Fh2>\n        <p style=\"font-size:14px;line-height:1.7;color:#BFB4AF;margin:0 0 8px;\">O prazo padrão para primeira resposta é de até <strong style=\"color:#fff;\">24 horas<\u002Fstrong>, contado a partir do recebimento da solicitação.<\u002Fp>\n        <p style=\"font-size:14px;line-height:1.7;color:#BFB4AF;margin:0 0 20px;\">Em situações que dependam de análise técnica, confirmação de pagamento, consulta a terceiros, plataformas de pagamento ou investigação de informações adicionais, a solução definitiva poderá exigir prazo superior. Nesses casos, o cliente será informado sobre o andamento da solicitação.<\u002Fp>\n\n        <h2 style=\"font-family:'Archivo',sans-serif;font-weight:800;font-size:16px;color:#fff;margin:0 0 10px;\">4. Informações necessárias para atendimento<\u002Fh2>\n        <p style=\"font-size:14px;line-height:1.7;color:#BFB4AF;margin:0 0 8px;\">Para agilizar o atendimento, o cliente deverá, sempre que possível, informar:<\u002Fp>\n        <ul style=\"font-size:14px;line-height:1.8;color:#BFB4AF;margin:0 0 8px;padding-left:20px;\">\n          <li>nome completo;<\u002Fli>\n          <li>e-mail utilizado na compra ou cadastro;<\u002Fli>\n          <li>número do pedido ou identificação da transação, quando disponível;<\u002Fli>\n          <li>descrição clara da dúvida ou problema;<\u002Fli>\n          <li>prints, comprovantes ou outras informações relacionadas à solicitação, quando necessários.<\u002Fli>\n        <\u002Ful>\n        <p style=\"font-size:14px;line-height:1.7;color:#BFB4AF;margin:0 0 20px;\">Nunca solicitaremos sua senha pessoal de e-mail, senha bancária, senha de cartão ou código completo de autenticação bancária.<\u002Fp>\n\n        <h2 style=\"font-family:'Archivo',sans-serif;font-weight:800;font-size:16px;color:#fff;margin:0 0 10px;\">5. Problemas de acesso<\u002Fh2>\n        <p style=\"font-size:14px;line-height:1.7;color:#BFB4AF;margin:0 0 8px;\">Em casos de dificuldade para acessar um produto, conteúdo, área de membros, grupo, plataforma ou serviço adquirido, nossa equipe poderá solicitar informações suficientes para localizar a compra e verificar o acesso.<\u002Fp>\n        <p style=\"font-size:14px;line-height:1.7;color:#BFB4AF;margin:0 0 20px;\">Após a confirmação dos dados, serão realizadas as verificações necessárias e fornecidas instruções para regularização do acesso.<\u002Fp>\n\n        <h2 style=\"font-family:'Archivo',sans-serif;font-weight:800;font-size:16px;color:#fff;margin:0 0 10px;\">6. Pagamentos e confirmação de compra<\u002Fh2>\n        <p style=\"font-size:14px;line-height:1.7;color:#BFB4AF;margin:0 0 8px;\">Alguns pagamentos podem depender do processamento da instituição financeira, adquirente, plataforma de pagamento ou meio utilizado pelo cliente.<\u002Fp>\n        <p style=\"font-size:14px;line-height:1.7;color:#BFB4AF;margin:0 0 8px;\">Quando necessário, o SAC poderá solicitar comprovante da transação para localizar ou confirmar o pagamento.<\u002Fp>\n        <p style=\"font-size:14px;line-height:1.7;color:#BFB4AF;margin:0 0 20px;\">O envio de comprovante não substitui a confirmação oficial da transação pelo sistema responsável pelo processamento do pagamento.<\u002Fp>\n\n        <h2 style=\"font-family:'Archivo',sans-serif;font-weight:800;font-size:16px;color:#fff;margin:0 0 10px;\">7. Cobranças<\u002Fh2>\n        <p style=\"font-size:14px;line-height:1.7;color:#BFB4AF;margin:0 0 8px;\">Caso o cliente identifique uma cobrança que não reconheça ou considere incorreta, deverá entrar em contato com o SAC pelos canais oficiais.<\u002Fp>\n        <p style=\"font-size:14px;line-height:1.7;color:#BFB4AF;margin:0 0 8px;\">A equipe realizará a análise das informações disponíveis e poderá solicitar dados adicionais necessários para identificar a transação.<\u002Fp>\n        <p style=\"font-size:14px;line-height:1.7;color:#BFB4AF;margin:0 0 20px;\">Recomendamos que o cliente não envie fotografias contendo o número completo do cartão, código de segurança, senha bancária ou qualquer credencial confidencial.<\u002Fp>\n\n        <h2 style=\"font-family:'Archivo',sans-serif;font-weight:800;font-size:16px;color:#fff;margin:0 0 10px;\">8. Cancelamentos e reembolsos<\u002Fh2>\n        <p style=\"font-size:14px;line-height:1.7;color:#BFB4AF;margin:0 0 8px;\">Pedidos de cancelamento ou reembolso serão analisados de acordo com as condições aplicáveis à compra, à oferta contratada e à legislação vigente.<\u002Fp>\n        <p style=\"font-size:14px;line-height:1.7;color:#BFB4AF;margin:0 0 8px;\">A solicitação deverá ser realizada utilizando os canais oficiais de atendimento e deverá conter informações suficientes para identificação da compra.<\u002Fp>\n        <p style=\"font-size:14px;line-height:1.7;color:#BFB4AF;margin:0 0 20px;\">Quando um reembolso for aprovado, o prazo efetivo para visualização do valor poderá depender do método de pagamento, banco, administradora do cartão ou plataforma utilizada na transação.<\u002Fp>\n\n        <h2 style=\"font-family:'Archivo',sans-serif;font-weight:800;font-size:16px;color:#fff;margin:0 0 10px;\">9. Produtos e serviços digitais<\u002Fh2>\n        <p style=\"font-size:14px;line-height:1.7;color:#BFB4AF;margin:0 0 8px;\">No caso de produtos ou serviços digitais, o cliente é responsável por utilizar um endereço de e-mail válido e manter seus dados de cadastro atualizados.<\u002Fp>\n        <p style=\"font-size:14px;line-height:1.7;color:#BFB4AF;margin:0 0 20px;\">Problemas decorrentes de informações incorretas fornecidas no momento da compra poderão exigir confirmação adicional de identidade ou titularidade antes da alteração dos dados de acesso.<\u002Fp>\n\n        <h2 style=\"font-family:'Archivo',sans-serif;font-weight:800;font-size:16px;color:#fff;margin:0 0 10px;\">10. Alteração de dados cadastrais<\u002Fh2>\n        <p style=\"font-size:14px;line-height:1.7;color:#BFB4AF;margin:0 0 8px;\">Solicitações envolvendo mudança de e-mail, telefone ou outros dados relacionados à conta poderão exigir confirmação de informações da compra como medida de segurança.<\u002Fp>\n        <p style=\"font-size:14px;line-height:1.7;color:#BFB4AF;margin:0 0 20px;\">A Métodos Lucrativos poderá recusar alterações quando não for possível confirmar de forma razoável a titularidade da conta ou da compra.<\u002Fp>\n\n        <h2 style=\"font-family:'Archivo',sans-serif;font-weight:800;font-size:16px;color:#fff;margin:0 0 10px;\">11. Segurança e prevenção a fraudes<\u002Fh2>\n        <p style=\"font-size:14px;line-height:1.7;color:#BFB4AF;margin:0 0 8px;\">Para proteger clientes e a própria operação, determinadas solicitações poderão passar por procedimentos adicionais de verificação.<\u002Fp>\n        <p style=\"font-size:14px;line-height:1.7;color:#BFB4AF;margin:0 0 8px;\">Podemos solicitar informações relacionadas à compra para confirmar a identidade ou titularidade do solicitante.<\u002Fp>\n        <p style=\"font-size:14px;line-height:1.7;color:#BFB4AF;margin:0 0 8px;\">Não solicitamos:<\u002Fp>\n        <ul style=\"font-size:14px;line-height:1.8;color:#BFB4AF;margin:0 0 20px;padding-left:20px;\">\n          <li>senha bancária;<\u002Fli>\n          <li>senha de cartão;<\u002Fli>\n          <li>código de segurança completo do cartão;<\u002Fli>\n          <li>acesso remoto à conta bancária;<\u002Fli>\n          <li>instalação de programas desconhecidos para realização do atendimento.<\u002Fli>\n        <\u002Ful>\n\n        <h2 style=\"font-family:'Archivo',sans-serif;font-weight:800;font-size:16px;color:#fff;margin:0 0 10px;\">12. Atendimento respeitoso<\u002Fh2>\n        <p style=\"font-size:14px;line-height:1.7;color:#BFB4AF;margin:0 0 8px;\">Nosso objetivo é manter um atendimento profissional e eficiente.<\u002Fp>\n        <p style=\"font-size:14px;line-height:1.7;color:#BFB4AF;margin:0 0 8px;\">Não serão toleradas ameaças, tentativas de fraude, assédio, envio de conteúdo ilegal ou comportamento abusivo contra membros da equipe.<\u002Fp>\n        <p style=\"font-size:14px;line-height:1.7;color:#BFB4AF;margin:0 0 20px;\">Situações dessa natureza poderão resultar na interrupção do atendimento pelo canal utilizado, sem impedir o tratamento de solicitações legítimas por meios adequados.<\u002Fp>\n\n        <h2 style=\"font-family:'Archivo',sans-serif;font-weight:800;font-size:16px;color:#fff;margin:0 0 10px;\">13. Duplicidade de solicitações<\u002Fh2>\n        <p style=\"font-size:14px;line-height:1.7;color:#BFB4AF;margin:0 0 8px;\">O envio repetido da mesma solicitação por diversos canais não reduz o prazo de análise e poderá dificultar a identificação do histórico do atendimento.<\u002Fp>\n        <p style=\"font-size:14px;line-height:1.7;color:#BFB4AF;margin:0 0 20px;\">Sempre que possível, recomendamos que o cliente mantenha a comunicação no mesmo atendimento até a conclusão da solicitação.<\u002Fp>\n\n        <h2 style=\"font-family:'Archivo',sans-serif;font-weight:800;font-size:16px;color:#fff;margin:0 0 10px;\">14. Registro do atendimento<\u002Fh2>\n        <p style=\"font-size:14px;line-height:1.7;color:#BFB4AF;margin:0 0 8px;\">As comunicações realizadas com o SAC poderão ser registradas e armazenadas para:<\u002Fp>\n        <ul style=\"font-size:14px;line-height:1.8;color:#BFB4AF;margin:0 0 8px;padding-left:20px;\">\n          <li>acompanhamento da solicitação;<\u002Fli>\n          <li>prevenção a fraudes;<\u002Fli>\n          <li>segurança;<\u002Fli>\n          <li>melhoria do atendimento;<\u002Fli>\n          <li>comprovação das comunicações realizadas;<\u002Fli>\n          <li>cumprimento de obrigações legais ou regulatórias aplicáveis.<\u002Fli>\n        <\u002Ful>\n        <p style=\"font-size:14px;line-height:1.7;color:#BFB4AF;margin:0 0 20px;\">O tratamento dessas informações deverá observar a legislação aplicável de proteção de dados.<\u002Fp>\n\n        <h2 style=\"font-family:'Archivo',sans-serif;font-weight:800;font-size:16px;color:#fff;margin:0 0 10px;\">15. Dados pessoais<\u002Fh2>\n        <p style=\"font-size:14px;line-height:1.7;color:#BFB4AF;margin:0 0 8px;\">As informações fornecidas ao SAC serão utilizadas exclusivamente para finalidades relacionadas ao atendimento, execução dos serviços, segurança, prevenção a fraudes, cumprimento de obrigações legais e demais finalidades legítimas relacionadas à relação com o cliente.<\u002Fp>\n        <p style=\"font-size:14px;line-height:1.7;color:#BFB4AF;margin:0 0 20px;\">Dados poderão ser compartilhados com prestadores de serviços quando isso for necessário para processar pagamentos, fornecer acesso, resolver problemas técnicos ou cumprir obrigações relacionadas à operação.<\u002Fp>\n\n        <h2 style=\"font-family:'Archivo',sans-serif;font-weight:800;font-size:16px;color:#fff;margin:0 0 10px;\">16. Prazo para resolução<\u002Fh2>\n        <p style=\"font-size:14px;line-height:1.7;color:#BFB4AF;margin:0 0 8px;\">Embora a primeira resposta seja enviada em até <strong style=\"color:#fff;\">24 horas<\u002Fstrong>, o tempo necessário para conclusão de uma solicitação dependerá de sua natureza.<\u002Fp>\n        <p style=\"font-size:14px;line-height:1.7;color:#BFB4AF;margin:0 0 8px;\">Questões simples poderão ser solucionadas no primeiro contato. Casos que envolvam pagamentos, análises técnicas, plataformas externas ou confirmação de informações poderão exigir prazo adicional.<\u002Fp>\n        <p style=\"font-size:14px;line-height:1.7;color:#BFB4AF;margin:0 0 20px;\">Quando isso ocorrer, nossa equipe fornecerá atualizações relevantes sobre a solicitação.<\u002Fp>\n\n        <h2 style=\"font-family:'Archivo',sans-serif;font-weight:800;font-size:16px;color:#fff;margin:0 0 10px;\">17. Responsabilidade do cliente<\u002Fh2>\n        <p style=\"font-size:14px;line-height:1.7;color:#BFB4AF;margin:0 0 8px;\">É responsabilidade do cliente:<\u002Fp>\n        <ul style=\"font-size:14px;line-height:1.8;color:#BFB4AF;margin:0 0 20px;padding-left:20px;\">\n          <li>fornecer informações verdadeiras;<\u002Fli>\n          <li>manter seus dados de contato atualizados;<\u002Fli>\n          <li>proteger suas credenciais de acesso;<\u002Fli>\n          <li>não compartilhar senhas pessoais;<\u002Fli>\n          <li>utilizar os produtos e serviços de acordo com as condições contratadas;<\u002Fli>\n          <li>comunicar rapidamente qualquer suspeita de acesso não autorizado à sua conta.<\u002Fli>\n        <\u002Ful>\n\n        <h2 style=\"font-family:'Archivo',sans-serif;font-weight:800;font-size:16px;color:#fff;margin:0 0 10px;\">18. Canal principal do SAC<\u002Fh2>\n        <p style=\"font-size:14px;line-height:1.7;color:#BFB4AF;margin:0 0 8px;\">Para solicitações que exijam registro detalhado, análise de documentos ou acompanhamento, recomendamos prioritariamente o contato pelo e-mail:<\u002Fp>\n        <p style=\"font-size:14px;line-height:1.7;color:#BFB4AF;margin:0 0 8px;\"><strong><a href=\"mailto:Sac@metodoslucrativos.com\" style=\"color:#D4AF37;\">Sac@metodoslucrativos.com<\u002Fa><\u002Fstrong><\u002Fp>\n        <p style=\"font-size:14px;line-height:1.7;color:#BFB4AF;margin:0 0 8px;\">Para dúvidas e atendimento direto, também está disponível:<\u002Fp>\n        <p style=\"font-size:14px;line-height:1.7;color:#BFB4AF;margin:0 0 8px;\"><strong style=\"color:#fff;\">(11) 92024-8503<\u002Fstrong><\u002Fp>\n        <p style=\"font-size:14px;line-height:1.7;color:#BFB4AF;margin:0;\"><strong style=\"color:#fff;\">Horário de atendimento:<\u002Fstrong> 08:00 às 20:00, horário de Brasília.<br><strong style=\"color:#fff;\">Prazo padrão para primeira resposta:<\u002Fstrong> até 24 horas.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ isPrivacy }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"position:fixed;inset:0;background:#0A0908;z-index:20;overflow-y:auto;\">\n      <div style=\"max-width:640px;margin:0 auto;padding:28px 20px 60px;\">\n        <a sc-camel-on-click=\"{{ goBackFromPrivacy }}\" style=\"display:inline-block;margin-bottom:24px;font-size:14px;font-weight:700;color:#D4AF37;cursor:pointer;text-decoration:none;\">← Voltar<\u002Fa>\n        <h1 style=\"font-family:'Archivo',sans-serif;font-weight:900;font-size:24px;color:#fff;margin:0 0 20px;\">Política de proteção e privacidade de dados pessoais<\u002Fh1>\n        <p style=\"font-size:14px;line-height:1.7;color:#BFB4AF;margin:0 0 16px;\">Nós, do Clube da Internet Esportiva LTDA ME (Clube da Aposta), sociedade inscrita no CNPJ/MF sob nº 53.837.227/0001-52, sabemos o quanto é importante proteger e preservar os seus dados pessoais e possuímos um sério compromisso de transparência com nossos clientes e usuários. Desse modo, queremos deixar claro, por meio da presente política, quais são os seus dados pessoais que tratamos e as finalidades desse tratamento.<\u002Fp>\n        <p style=\"font-size:14px;line-height:1.7;color:#BFB4AF;margin:0 0 8px;\"><strong style=\"color:#fff;\">Encarregado de Dados Pessoais:<\u002Fstrong> Humberto Alves<\u002Fp>\n        <p style=\"font-size:14px;line-height:1.7;color:#BFB4AF;margin:0 0 16px;\"><strong style=\"color:#fff;\">Contato do encarregado:<\u002Fstrong> dadospessoaisclubedaposta@gmail.com<\u002Fp>\n        <p style=\"font-size:14px;line-height:1.7;color:#BFB4AF;margin:0 0 16px;\">Por meio da leitura da presente Política, você saberá quais os dados pessoais tratamos, o porquê os tratamos, como tratamos e protegemos seus dados pessoais. A presente política traz, ainda, informações sobre os seus direitos enquanto titular dos dados pessoais e como poderá exercê-los.<\u002Fp>\n        <p style=\"font-size:14px;line-height:1.7;color:#BFB4AF;margin:0 0 16px;\">Todas as operações realizadas pelo Clube da Aposta com dados pessoais são feitas com respeito aos seus direitos, em especial, direito à privacidade e com garantia da segurança dos seus dados pessoais.<\u002Fp>\n        <p style=\"font-size:14px;line-height:1.7;color:#BFB4AF;margin:0 0 28px;\">Caso reste qualquer dúvida com relação ao tratamento de seus dados pessoais ou caso queira exercer quaisquer de seus direitos, não deixe de nos contatar através do e-mail dadospessoaisclubedaposta@gmail.com, que retornaremos o mais breve possível.<\u002Fp>\n\n        <h2 style=\"font-family:'Archivo',sans-serif;font-weight:800;font-size:18px;color:#fff;margin:0 0 12px;\">1. O que são dados pessoais?<\u002Fh2>\n        <p style=\"font-size:14px;line-height:1.7;color:#BFB4AF;margin:0 0 12px;\">Nos termos da Lei Geral de Proteção de Dados (Lei 13.709/2018), dados pessoais são aqueles capazes de identificar ou tornar identificáveis seus titulares (pessoas naturais). Dados que identificam, são, por exemplo, nome e CPF, já exemplos dos dados identificáveis são: endereços IP do computador.<\u002Fp>\n        <p style=\"font-size:14px;line-height:1.7;color:#BFB4AF;margin:0 0 28px;\">Ao final da presente Política você poderá encontrar um glossário com outros conceitos que são importantes para compreender melhor a privacidade dos seus dados pessoais.<\u002Fp>\n\n        <h2 style=\"font-family:'Archivo',sans-serif;font-weight:800;font-size:18px;color:#fff;margin:0 0 12px;\">2. Dados Pessoais Coletados<\u002Fh2>\n        <p style=\"font-size:14px;line-height:1.7;color:#BFB4AF;margin:0 0 12px;\">Enquanto seu prestador de serviços, o Clube da Aposta trata seus dados pessoais na qualidade de controlador, garantindo segurança e transparência, sempre de acordo com as leis aplicáveis e melhores práticas de mercado. Somente serão tratados os dados necessários para prestar e otimizar nossos serviços, sempre atendendo a você da melhor maneira possível.<\u002Fp>\n        <p style=\"font-size:14px;line-height:1.7;color:#BFB4AF;margin:0 0 12px;\">Nós coletamos seus dados pessoais quando você nos encaminha alguma solicitação, quando acessa nosso site, quando nos encaminha formulários, quando adquire um dos nossos produtos ou serviços, quando realiza algum tipo de parceria conosco e quando nos encaminha seus dados de qualquer outra forma.<\u002Fp>\n        <p style=\"font-size:14px;line-height:1.7;color:#BFB4AF;margin:0 0 16px;\">O tipo e a quantidade de dados pessoais coletados em cada situação irão depender do motivo do contato ou da solicitação feitos, do serviço a ser prestado, do produto a ser vendido, dentre outros. Mas, em todo caso, a finalidade da coleta será respeitada, de modo que não utilizaremos os seus dados para fins diversos. Para melhor visualização, na tabela abaixo você poderá verificar exemplos de situações em que seus dados são tratados:<\u002Fp>\n\n        <div style=\"border:1px solid #3A3120;border-radius:10px;overflow:hidden;margin-bottom:28px;\">\n          <div style=\"display:grid;grid-template-columns:1fr 1fr 1fr;background:#14120C;padding:10px 12px;font-size:12px;font-weight:700;color:#fff;\">\n            <div>Situação<\u002Fdiv><div>Base Legal<\u002Fdiv><div>Dados tratados<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display:grid;grid-template-columns:1fr 1fr 1fr;padding:10px 12px;font-size:12px;color:#BFB4AF;border-top:1px solid #3A3120;\">\n            <div>Resposta a uma pesquisa para a criação de novos produtos ou serviços<\u002Fdiv><div>Interesse legítimo<\u002Fdiv><div>Nome e e-mail<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display:grid;grid-template-columns:1fr 1fr 1fr;padding:10px 12px;font-size:12px;color:#BFB4AF;border-top:1px solid #3A3120;\">\n            <div>Aquisição de treinamentos e serviços do Clube da Aposta<\u002Fdiv><div>Execução de contrato<\u002Fdiv><div>Nome, e-mail, telefone, CPF<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display:grid;grid-template-columns:1fr 1fr 1fr;padding:10px 12px;font-size:12px;color:#BFB4AF;border-top:1px solid #3A3120;\">\n            <div>Oferecimento de melhores experiências de publicidade através do histórico de navegação<\u002Fdiv><div>Interesse Legítimo<\u002Fdiv><div>IP do usuário<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <h2 style=\"font-family:'Archivo',sans-serif;font-weight:800;font-size:18px;color:#fff;margin:0 0 12px;\">Seus direitos como titular de dados pessoais<\u002Fh2>\n        <p style=\"font-size:14px;line-height:1.7;color:#BFB4AF;margin:0 0 12px;\">Nós asseguramos os seus direitos relativos à privacidade e a proteção dos seus dados pessoais, conforme previsto na Lei 13.709/2018 e detalhado no Glossário contido no final deste documento.<\u002Fp>\n        <p style=\"font-size:14px;line-height:1.7;color:#BFB4AF;margin:0 0 12px;\">Você pode exercer seus direitos a qualquer momento, mediante requisição expressa, com o envio de um e-mail, para o endereço dadospessoaisclubedaposta@gmail.com.<\u002Fp>\n        <p style=\"font-size:14px;line-height:1.7;color:#BFB4AF;margin:0 0 12px;\">Por motivos de segurança, talvez solicitaremos informações específicas para nos ajudar a confirmar sua identidade e garantir seu direito de acessar seus dados pessoais. Nos preocupamos com essa medida justamente para garantir seus dados não sejam divulgados a qualquer pessoa que não tenha direito de recebê-los.<\u002Fp>\n        <p style=\"font-size:14px;line-height:1.7;color:#BFB4AF;margin:0 0 12px;\">Sempre que você enviar alguma requisição para exercer seus direitos, o Clube da Aposta fornecerá as informações por meio de declaração clara, observados segredos comercial e industrial. Ponderamos que empreenderemos os esforços razoáveis para atender as suas requisições no menor espaço de tempo possível. No entanto, fatores justificáveis, tais como a complexidade da ação requisitada, poderão atrasar ou impedir o seu rápido atendimento, caso em que lhe apresentaremos os devidos motivos.<\u002Fp>\n        <p style=\"font-size:14px;line-height:1.7;color:#BFB4AF;margin:0 0 12px;\">Precisamos esclarecer que eventualmente suas requisições poderão ser legalmente rejeitadas, seja por motivos formais (a exemplo de sua incapacidade de comprovar sua identidade) ou legais (a exemplo do pedido de exclusão de dados cuja manutenção é exigência regulamentar). Nessas hipóteses nós lhe apresentaremos as justificativas da negativa de forma clara e objetiva.<\u002Fp>\n        <p style=\"font-size:14px;line-height:1.7;color:#BFB4AF;margin:0 0 28px;\">Por fim, ressaltamos que, caso sua intenção seja apenas deixar de receber nossos e-mails quanto a promoções e novidades dos produtos do Clube da Aposta, você poderá a qualquer momento se descadastrar deste recebimento diretamente pelo seu e-mail, bastando para tanto que utilize o botão \"Descadastrar\" nas mensagens que forem por nós enviadas.<\u002Fp>\n\n        <h2 style=\"font-family:'Archivo',sans-serif;font-weight:800;font-size:18px;color:#fff;margin:0 0 12px;\">4. Compartilhamento e divulgação de seus dados pessoais<\u002Fh2>\n        <p style=\"font-size:14px;line-height:1.7;color:#BFB4AF;margin:0 0 12px;\">Para que possamos otimizar os serviços prestados a você e para cumprir com as finalidades elencadas na presente política, o Clube da Aposta se resguarda o direito de compartilhar alguns de seus dados pessoais com empresas parceiras.<\u002Fp>\n        <p style=\"font-size:14px;line-height:1.7;color:#BFB4AF;margin:0 0 12px;\">Tal compartilhamento é realizado de forma segura, levando em consideração a aplicação de medidas adequadas para a segurança de seus dados pessoais. Importante dizer que nossos parceiros somente são autorizados a utilizar os seus dados pessoais para os fins específicos que eles foram contratados e de acordo com a finalidade para a qual os seus dados foram coletados.<\u002Fp>\n        <p style=\"font-size:14px;line-height:1.7;color:#BFB4AF;margin:0 0 28px;\">O Clube da Aposta poderá também compartilhar os seus dados com autoridades, entidades governamentais ou outros terceiros para o exercício regular de direitos em processo judicial, administrativo ou arbitral ou mediante ordem judicial.<\u002Fp>\n\n        <h2 style=\"font-family:'Archivo',sans-serif;font-weight:800;font-size:18px;color:#fff;margin:0 0 12px;\">5. Proteção dos seus dados<\u002Fh2>\n        <p style=\"font-size:14px;line-height:1.7;color:#BFB4AF;margin:0 0 12px;\">Informamos que nós estamos constantemente tomando todas as providências técnicas e organizacionais possíveis para proteger os seus dados pessoais e buscamos sempre aprimorar nossa segurança. Nesse sentido, adotamos políticas e medidas internas que visam manter os seus dados pessoais seguros e protegidos de acessos não autorizados e de situações acidentais ou ilícitas de destruição, perda, alteração, comunicação ou qualquer outra forma de tratamento inadequado ou ilícito, sempre à luz das regras aplicáveis de proteção de dados e segurança da informação.<\u002Fp>\n        <p style=\"font-size:14px;line-height:1.7;color:#BFB4AF;margin:0 0 12px;\">Mas, ainda com todos os esforços empreendidos, sabemos que infelizmente não é possível garantir total segurança. Assim, pedimos sempre que nos ajude a manter um ambiente seguro para todos. Caso identifique ou tome conhecimento de algo que comprometa a segurança dos dados pessoais, por favor entre em contato conosco imediatamente através da aba de contato localizada no nosso site.<\u002Fp>\n        <p style=\"font-size:14px;line-height:1.7;color:#BFB4AF;margin:0 0 28px;\">O Clube da Aposta se exime de responsabilidade por culpa exclusiva de terceiros ou culpa exclusiva do usuário.<\u002Fp>\n\n        <h2 style=\"font-family:'Archivo',sans-serif;font-weight:800;font-size:18px;color:#fff;margin:0 0 12px;\">6. Consequências de não fornecer seus dados<\u002Fh2>\n        <p style=\"font-size:14px;line-height:1.7;color:#BFB4AF;margin:0 0 12px;\">É importante ponderar que, para que possamos presta-lhe nossos serviços, é necessário que haja o fornecimento de alguns de seus dados pessoais. Caso contrário, não será possível que você desfrute de nossos serviços ou produtos, ou mesmo, receba nossos conteúdos mais recentes.<\u002Fp>\n        <p style=\"font-size:14px;line-height:1.7;color:#BFB4AF;margin:0 0 28px;\">Sendo assim, caso você tenha a intenção de ser nosso cliente, precisaremos tratar alguns de seus dados pessoais.<\u002Fp>\n\n        <h2 style=\"font-family:'Archivo',sans-serif;font-weight:800;font-size:18px;color:#fff;margin:0 0 12px;\">7. Por quanto tempo mantemos seus dados<\u002Fh2>\n        <p style=\"font-size:14px;line-height:1.7;color:#BFB4AF;margin:0 0 12px;\">Nós manteremos os seus dados pessoais pelo tempo que for necessário para cumprir com as finalidades para as quais os coletamos, inclusive para fins de cumprimento de quaisquer obrigações legais, regulatórias, contratuais, de prestação de contas, requisição de autoridades competentes e exercício dos direitos do Clube da Aposta em processos judiciais ou administrativos.<\u002Fp>\n        <p style=\"font-size:14px;line-height:1.7;color:#BFB4AF;margin:0 0 28px;\">Dessa forma, os seus dados serão excluídos de nossos servidores ou anonimizados quando você assim requisitar ou quando estes não forem mais necessários ou relevantes para as finalidades a que se destinam, salvo se houver qualquer outra razão justificada para a manutenção desses dados, como eventual autorização legal para retenção, ou necessidade de preservação destes para resguardo de direitos do Clube da Aposta.<\u002Fp>\n\n        <h2 style=\"font-family:'Archivo',sans-serif;font-weight:800;font-size:18px;color:#fff;margin:0 0 12px;\">8. O que são e como utilizamos Cookies<\u002Fh2>\n        <p style=\"font-size:14px;line-height:1.7;color:#BFB4AF;margin:0 0 12px;\">Cookies são pequenos arquivos que são transferidos para o seu navegador ou dispositivo quando você acessa nosso website. Nós utilizamos cookies para garantir que nosso website irá lhe proporcionar uma experiência mais agradável e também produtos para você como visitante.<\u002Fp>\n        <p style=\"font-size:14px;line-height:1.7;color:#BFB4AF;margin:0 0 12px;\">Nós usamos cookies com o intuito de melhorar sua experiência como usuário em nosso website. Monitoramos as atividades que você faz dentro de nosso site, para sabermos quais os assuntos que mais o interessam dentro de nossa plataforma e direcionar informações de produtos ou serviços com maior assertividade, possibilitando a você otimizar o seu tempo, e acessar os melhores conteúdos disponíveis em nossa plataforma.<\u002Fp>\n        <p style=\"font-size:14px;line-height:1.7;color:#BFB4AF;margin:0 0 12px;\">Caso você acesse e/ou navegue em nosso website, você está ciente do uso de nossos cookies em seu aparelho para que possamos ser capazes de oferecer a você outras funcionalidades do nosso website, como o direcionamento de conteúdos que possam lhe interessar ou então te oferecer atalhos diretos para páginas que possam o interessar mais.<\u002Fp>\n        <p style=\"font-size:14px;line-height:1.7;color:#BFB4AF;margin:0 0 28px;\">Caso você não tenha interesse em nossos cookies, você pode optar por recusar ou desabilitar os cookies (exceto os necessários) por meio das configurações do seu navegador (verificando as instruções do navegador específico), ou ao instalar um plug-in que realize essa funcionalidade. No entanto, ao fazer isso, você deve estar ciente de que algumas áreas de nosso website podem não funcionar corretamente.<\u002Fp>\n\n        <h2 style=\"font-family:'Archivo',sans-serif;font-weight:800;font-size:18px;color:#fff;margin:0 0 12px;\">9. Alterações à Política de Privacidade<\u002Fh2>\n        <p style=\"font-size:14px;line-height:1.7;color:#BFB4AF;margin:0 0 12px;\">Como estamos sempre buscando aprimoramento, esta Política pode passar por atualizações a qualquer momento. Neste caso, as modificações serão publicadas nesta página para que você possa sempre se manter informado sobre o tratamento dos seus dados pessoais. Nesse sentido, recomendamos que você acesse nossa Política periodicamente, para que tenha conhecimento sobre quaisquer atualizações.<\u002Fp>\n        <p style=\"font-size:14px;line-height:1.7;color:#BFB4AF;margin:0 0 28px;\">Caso queira nos contatar para tratar sobre quaisquer temas relacionados à privacidade ou proteção de dados nos encaminhe um e-mail por meio do endereço dadospessoaisclubedaposta@gmail.com. Não deixe de nos enviar também suas sugestões e opiniões.<\u002Fp>\n\n        <h2 style=\"font-family:'Archivo',sans-serif;font-weight:800;font-size:18px;color:#fff;margin:0 0 12px;\">10. Glossário<\u002Fh2>\n        <p style=\"font-size:14px;line-height:1.7;color:#BFB4AF;margin:0 0 16px;\">Elencamos abaixo alguns conceitos dados pela própria Lei Geral de Proteção de Dados e outros adicionais que são de extrema relevância para que você possa compreender melhor o tema. Não deixe de conferi-los!<\u002Fp>\n        <p style=\"font-size:14px;line-height:1.7;color:#BFB4AF;margin:0 0 10px;\"><strong style=\"color:#fff;\">Dado pessoal:<\u002Fstrong> qualquer informação que identifique você ou que possa identificá-lo;<\u002Fp>\n        <p style=\"font-size:14px;line-height:1.7;color:#BFB4AF;margin:0 0 10px;\"><strong style=\"color:#fff;\">Dado pessoal sensível:<\u002Fstrong> dados sobre sua origem racial ou étnica, convicção religiosa, opinião política, filiação a sindicato ou a organização de caráter religioso, filosófico ou político, dado referente à saúde ou à vida sexual, dado genético ou biométrico;<\u002Fp>\n        <p style=\"font-size:14px;line-height:1.7;color:#BFB4AF;margin:0 0 10px;\"><strong style=\"color:#fff;\">Tratamento:<\u002Fstrong> toda operação realizada com dados pessoais;<\u002Fp>\n        <p style=\"font-size:14px;line-height:1.7;color:#BFB4AF;margin:0 0 10px;\"><strong style=\"color:#fff;\">Titular:<\u002Fstrong> você, nosso amigo que lê o presente documento;<\u002Fp>\n        <p style=\"font-size:14px;line-height:1.7;color:#BFB4AF;margin:0 0 10px;\"><strong style=\"color:#fff;\">Uso compartilhado de dados:<\u002Fstrong> quando transferimos seus dados pessoais para outra pessoa, seja ela uma pessoa física ou jurídica;<\u002Fp>\n        <p style=\"font-size:14px;line-height:1.7;color:#BFB4AF;margin:0 0 10px;\"><strong style=\"color:#fff;\">IP:<\u002Fstrong> abreviatura de Internet Protocol. É um conjunto de números que identifica o computador dos usuários na internet.<\u002Fp>\n        <p style=\"font-size:14px;line-height:1.7;color:#BFB4AF;margin:0 0 10px;\"><strong style=\"color:#fff;\">Site ou website:<\u002Fstrong> designa o endereço eletrônico do site do Clube da Aposta, qual seja, https://t.me/Alavancagebet2026.<\u002Fp>\n        <p style=\"font-size:14px;line-height:1.7;color:#BFB4AF;margin:0 0 10px;\"><strong style=\"color:#fff;\">Usuário:<\u002Fstrong> pessoas que, como você, acessam o site e/ou interagem com as atividades nele oferecidas.<\u002Fp>\n        <p style=\"font-size:14px;line-height:1.7;color:#BFB4AF;margin:0 0 10px;\"><strong style=\"color:#fff;\">Anonimização:<\u002Fstrong> utilização de meios técnicos razoáveis e disponíveis no momento do tratamento, por meio dos quais um dado perde a possibilidade de associação, direta ou indireta, a um indivíduo;<\u002Fp>\n        <p style=\"font-size:14px;line-height:1.7;color:#BFB4AF;margin:0 0 10px;\"><strong style=\"color:#fff;\">Dado anonimizado:<\u002Fstrong> dado relativo a titular que não possa ser identificado, considerando a utilização de meios técnicos razoáveis e disponíveis na ocasião de seu tratamento;<\u002Fp>\n        <p style=\"font-size:14px;line-height:1.7;color:#BFB4AF;margin:0 0 10px;\"><strong style=\"color:#fff;\">Banco de dados:<\u002Fstrong> conjunto estruturado de dados pessoais, estabelecido em um ou em vários locais, em suporte eletrônico ou físico;<\u002Fp>\n        <p style=\"font-size:14px;line-height:1.7;color:#BFB4AF;margin:0 0 10px;\"><strong style=\"color:#fff;\">Consentimento:<\u002Fstrong> manifestação livre, informada e inequívoca pela qual o titular concorda com o tratamento de seus dados pessoais para uma finalidade determinada;<\u002Fp>\n        <p style=\"font-size:14px;line-height:1.7;color:#BFB4AF;margin:0 0 10px;\"><strong style=\"color:#fff;\">Bloqueio:<\u002Fstrong> suspensão temporária de qualquer operação de tratamento, mediante guarda do dado pessoal ou do banco de dados;<\u002Fp>\n        <p style=\"font-size:14px;line-height:1.7;color:#BFB4AF;margin:0 0 10px;\"><strong style=\"color:#fff;\">Eliminação:<\u002Fstrong> exclusão de dado ou de conjunto de dados armazenados em banco de dados, independentemente do procedimento empregado;<\u002Fp>\n        <p style=\"font-size:14px;line-height:1.7;color:#BFB4AF;margin:0 0 20px;\"><strong style=\"color:#fff;\">Direitos do titular de dados pessoais:<\u002Fstrong> obter do controlador, em relação aos dados do titular por ele tratados, a qualquer momento e mediante requisição: confirmação da existência de tratamento; acesso aos dados; correção de dados incompletos, inexatos ou desatualizados; anonimização, bloqueio ou eliminação de dados desnecessários, excessivos ou tratados em desconformidade com o disposto nesta Lei; portabilidade dos dados a outro fornecedor de serviço ou produto, mediante requisição expressa, de acordo com a regulamentação da autoridade nacional, observados os segredos comercial e industrial; eliminação dos dados pessoais tratados com o consentimento do titular, exceto nas hipóteses legais; informação das entidades públicas e privadas com as quais o controlador realizou uso compartilhado de dados; informação sobre a possibilidade de não fornecer consentimento e sobre as consequências da negativa; revogação do consentimento.<\u002Fp>\n        <p style=\"font-size:12px;color:#6B7280;margin:0;\">Versão da Política: 15/07/2021.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n<\u002Fdiv>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\">\nconst CONFIG = { whatsappNumber: \"5518982076646\", redirectSeconds: 2 };\n\nconst COUNTDOWN_MESSAGES = {\n  5: \"Preparando seu acesso...\",\n  4: \"Organizando suas informações...\",\n  3: \"Preparando seu atendimento...\",\n  2: \"Abrindo o WhatsApp...\",\n  1: \"Tudo pronto...\"\n};\n\nconst Q_DEFS = {\n  q1: [\n    { value: \"Tenho conta na B&tano\", label: \"A — Tenho conta na B&tano\" },\n    { value: \"Tenho conta na B&t365\", label: \"B — Tenho conta na B&t365\" },\n    { value: \"Ainda não tenho conta em nenhuma\", label: \"C — Ainda não tenho conta em nenhuma\" }\n  ],\n  q2: [\n    { value: \"É uma conta nova\", label: \"A — É uma conta nova\" },\n    { value: \"É uma conta antiga\", label: \"B — É uma conta antiga\" },\n    { value: \"Ainda não tenho conta\", label: \"C — Ainda não tenho conta\" }\n  ],\n  q3: [\n    { value: \"Sim, minha conta está verificada\", label: \"A — Sim, minha conta está verificada\" },\n    { value: \"Não, ainda não está verificada\", label: \"B — Não, ainda não está verificada\" },\n    { value: \"Não sei / ainda não tenho conta\", label: \"C — Não sei / ainda não tenho conta\" }\n  ]\n};\n\nconst META_SCREEN_EVENTS = {\n  landing: \"LandingView\",\n  age_gate: \"AgeGateView\",\n  quiz1: \"Quiz1View\",\n  quiz2: \"Quiz2View\",\n  quiz3: \"Quiz3View\",\n  qualification: \"QualificationView\",\n  preparation: \"PreparationView\",\n  underage_ask: \"UnderageAskView\",\n  underage_handoff: \"UnderageHandoffView\",\n  underage_end: \"UnderageEndView\",\n  privacy: \"PrivacyView\",\n  sac: \"SacView\"\n};\n\nconst QUIZ_COMPLETE_EVENTS = {\n  casa: \"Quiz1Complete\",\n  idadeConta: \"Quiz2Complete\",\n  verificacao: \"Quiz3Complete\"\n};\n\nconst firedMetaEvents = new Set();\nlet whatsappIntentSent = false;\n\nfunction trackMeta(eventName, params) {\n  const payload = params || {};\n  if (typeof fbq === \"function\") {\n    fbq(\"trackCustom\", eventName, payload);\n    console.log(\"[META PIXEL]\", eventName, payload);\n  } else {\n    console.warn(\"[META PIXEL] fbq não disponível:\", eventName);\n  }\n}\n\nfunction trackMetaOnce(eventName, params, dedupeKey) {\n  const key = dedupeKey || eventName;\n  if (firedMetaEvents.has(key)) return;\n  firedMetaEvents.add(key);\n  trackMeta(eventName, params);\n}\n\nclass Component extends DCLogic {\n  ctaRef = React.createRef();\n  securityRef = React.createRef();\n  legalRef = React.createRef();\n  revealed = { security: false, legal: false };\n\n  componentDidMount() {\n    if (window.Lenis) {\n      this.lenis = new window.Lenis({ duration: 1.05, smoothWheel: true, smoothTouch: false });\n      const raf = (time) => { this.lenis.raf(time); this.rafId = requestAnimationFrame(raf); };\n      this.rafId = requestAnimationFrame(raf);\n    }\n    this.onScrollCta = () => {\n      const el = this.ctaRef.current;\n      const show = !!el && this.state.screen === \"landing\" && el.getBoundingClientRect().bottom < 0;\n      if (show !== this.state.stickyCta) this.setState({ stickyCta: show });\n    };\n    window.addEventListener(\"scroll\", this.onScrollCta, { passive: true });\n    window.addEventListener(\"resize\", this.onScrollCta);\n    this.onScrollCta();\n    const io = new IntersectionObserver((entries) => {\n      entries.forEach((entry) => {\n        if (!entry.isIntersecting) return;\n        const key = entry.target.dataset.revealKey;\n        if (key && !this.revealed[key]) {\n          this.revealed[key] = true;\n          this.forceUpdate();\n          io.unobserve(entry.target);\n        }\n      });\n    }, { threshold: 0, rootMargin: \"0px 0px -5% 0px\" });\n    [[\"security\", this.securityRef], [\"legal\", this.legalRef]].forEach(([key, ref]) => {\n      if (ref.current) { ref.current.dataset.revealKey = key; io.observe(ref.current); }\n    });\n    this.io = io;\n    trackMetaOnce(META_SCREEN_EVENTS[this.state.screen] || \"LandingView\");\n  }\n  componentWillUnmount() {\n    if (this.interval) clearInterval(this.interval);\n    if (this.io) this.io.disconnect();\n    window.removeEventListener(\"scroll\", this.onScrollCta);\n    window.removeEventListener(\"resize\", this.onScrollCta);\n    if (this.rafId) cancelAnimationFrame(this.rafId);\n    if (this.lenis) this.lenis.destroy();\n  }\n  scrollToCta = () => {\n    const el = this.ctaRef.current;\n    if (el) {\n      const rect = el.getBoundingClientRect();\n      const top = Math.max(window.scrollY + rect.top - (window.innerHeight - rect.height) / 2, 0);\n      if (this.lenis) this.lenis.scrollTo(top, { duration: 1.1 });\n      else window.scrollTo({ top, behavior: \"smooth\" });\n    }\n  };\n  state = {\n    screen: \"landing\",\n    stickyCta: false,\n    quiz: { casa: null, idadeConta: null, verificacao: null },\n    locked: false,\n    feedback: \"\",\n    count: CONFIG.redirectSeconds\n  };\n\n  componentDidUpdate(prevProps, prevState) {\n    if (prevState && prevState.screen !== this.state.screen && this.onScrollCta) this.onScrollCta();\n  }\n\n  goTo = (screen) => {\n    const viewEvent = META_SCREEN_EVENTS[screen];\n    if (viewEvent) trackMetaOnce(viewEvent);\n    this.setState({ screen, feedback: \"\" });\n    if (this.lenis) this.lenis.scrollTo(0, { immediate: true });\n    else window.scrollTo(0, 0);\n  };\n\n  confirmAdult = () => {\n    trackMetaOnce(\"Age18Confirmed\");\n    this.goTo(\"quiz1\");\n  };\n  denyAdult = () => {\n    trackMetaOnce(\"Age18Denied\");\n    this.goTo(\"underage_ask\");\n  };\n  underageHasAdult = () => this.goTo(\"underage_handoff\");\n  underageNoAdult = () => this.goTo(\"underage_end\");\n  startAdultConfirmation = () => this.goTo(\"age_gate\");\n  goToPrivacy = () => this.goTo(\"privacy\");\n  goBackFromPrivacy = () => this.goTo(\"landing\");\n  goToSac = () => this.goTo(\"sac\");\n  goBackFromSac = () => this.goTo(\"landing\");\n\n  selectAnswer(qKey, value, feedbackText, nextScreen) {\n    if (this.state.locked) return;\n    const quiz = { ...this.state.quiz, [qKey]: value };\n    if (QUIZ_COMPLETE_EVENTS[qKey]) trackMetaOnce(QUIZ_COMPLETE_EVENTS[qKey]);\n    if (quiz.casa && quiz.idadeConta && quiz.verificacao) trackMetaOnce(\"QuizComplete\");\n    this.setState({ quiz, locked: true, feedback: feedbackText });\n    setTimeout(() => {\n      const viewEvent = META_SCREEN_EVENTS[nextScreen];\n      if (viewEvent) trackMetaOnce(viewEvent);\n      this.setState({ screen: nextScreen, feedback: \"\", locked: false });\n      if (this.lenis) this.lenis.scrollTo(0, { immediate: true });\n      else window.scrollTo(0, 0);\n\n    }, 650);\n  }\n\n  startCountdown() {\n    if (this.interval) clearInterval(this.interval);\n    this.setState({ count: CONFIG.redirectSeconds });\n    this.interval = setInterval(() => {\n      const next = this.state.count - 1;\n      if (next <= 0) {\n        clearInterval(this.interval);\n        this.goToWhatsapp(\"auto\");\n      } else {\n        this.setState({ count: next });\n      }\n    }, 1000);\n  }\n\n  buildWhatsappUrl = () => {\n    const { casa, idadeConta, verificacao } = this.state.quiz;\n    const message = `Olá! Acabei de concluir as etapas na página e estou pronto para o Método Lucrativo de 15 a 30 mil reais.\n\nMinhas informações:\n\nCasa informada: ${casa}\nSituação da conta: ${idadeConta}\nVerificação: ${verificacao}\n\nQuero receber as informações sobre os próximos passos.`;\n    return \"https://wa.me/\" + CONFIG.whatsappNumber + \"?text=\" + encodeURIComponent(message);\n  };\n\n  goToWhatsapp = (method) => {\n    if (whatsappIntentSent) return;\n    whatsappIntentSent = true;\n    if (this.interval) clearInterval(this.interval);\n    trackMetaOnce(method === \"manual\" ? \"WhatsAppManualClick\" : \"WhatsAppAutoRedirect\");\n    trackMetaOnce(\"WhatsAppIntent\", { method }, \"WhatsAppIntent:\" + method);\n    const url = this.buildWhatsappUrl();\n    setTimeout(() => { window.location.href = url; }, 150);\n  };\n\n  manualRedirect = () => this.goToWhatsapp(\"manual\");\n\n  confirmQualifiedIntent = () => {\n    if (this.qualifiedIntentSent) return;\n    this.qualifiedIntentSent = true;\n    trackMetaOnce(\"QualifiedIntent\");\n    this.goTo(\"preparation\");\n    this.startCountdown();\n  };\n\n  makeOptions(qKey, defs, currentValue, feedbackText, nextScreen) {\n    return defs.map((d, i) => {\n      const active = currentValue === d.value;\n      const parts = d.label.split(\" — \");\n      return {\n        label: d.label,\n        letter: parts[0],\n        text: parts.slice(1).join(\" — \"),\n        chipStyle: {\n          flexShrink: 0,\n          width: \"30px\",\n          height: \"30px\",\n          borderRadius: \"9px\",\n          display: \"flex\",\n          alignItems: \"center\",\n          justifyContent: \"center\",\n          fontFamily: \"'Archivo', sans-serif\",\n          fontWeight: 900,\n          fontSize: \"13px\",\n          background: active ? \"#12A05C\" : \"rgba(212,175,55,0.14)\",\n          color: active ? \"#03170D\" : \"#D4AF37\",\n          transition: \"background .2s ease, color .2s ease\"\n        },\n        checkStyle: {\n          flexShrink: 0,\n          fontSize: \"15px\",\n          fontWeight: 800,\n          color: \"#12A05C\",\n          opacity: active ? 1 : 0,\n          transition: \"opacity .2s ease\"\n        },\n        style: {\n          width: \"100%\",\n          display: \"flex\",\n          alignItems: \"center\",\n          gap: \"13px\",\n          padding: \"16px 16px\",\n          textAlign: \"left\",\n          background: active ? \"rgba(18,160,92,0.16)\" : \"#14120C\",\n          border: active ? \"1.5px solid #12A05C\" : \"1px solid #3A3120\",\n          borderRadius: \"14px\",\n          color: \"#F5F7F8\",\n          fontSize: \"15px\",\n          fontWeight: 600,\n          cursor: \"pointer\",\n          animation: \"fadeUp .5s ease both\",\n          animationDelay: (0.36 + i * 0.1) + \"s\"\n        },\n        onClick: () => this.selectAnswer(qKey, d.value, feedbackText, nextScreen)\n      };\n    });\n  }\n\n  renderVals() {\n    const { screen, quiz, feedback, count } = this.state;\n    const isQuiz1 = screen === \"quiz1\";\n    const isQuiz2 = screen === \"quiz2\";\n    const isQuiz3 = screen === \"quiz3\";\n    const progressPct = isQuiz1 ? 33 : isQuiz2 ? 66 : isQuiz3 ? 100 : 0;\n    const stepIdx = isQuiz1 ? 1 : isQuiz2 ? 2 : isQuiz3 ? 3 : 0;\n    const dot = (n) => ({\n      width: n <= stepIdx ? \"22px\" : \"8px\",\n      height: \"8px\",\n      borderRadius: \"999px\",\n      background: n < stepIdx ? \"#12A05C\" : n === stepIdx ? \"#D4AF37\" : \"#3A3120\",\n      transition: \"width .35s ease, background .35s ease\"\n    });\n\n    return {\n      dot1Style: dot(1),\n      dot2Style: dot(2),\n      dot3Style: dot(3),\n      stepCounter: \"0\" + stepIdx + \" / 03\",\n      showStickyCta: screen === \"landing\" && this.state.stickyCta,\n      isLanding: screen === \"landing\",\n      isAgeGate: screen === \"age_gate\",\n      isUnderageAsk: screen === \"underage_ask\",\n      isUnderageHandoff: screen === \"underage_handoff\",\n      isUnderageEnd: screen === \"underage_end\",\n      isQuiz1, isQuiz2, isQuiz3,\n      isQuizScreen: isQuiz1 || isQuiz2 || isQuiz3,\n      isQualification: screen === \"qualification\",\n      confirmQualifiedIntent: this.confirmQualifiedIntent,\n      isPreparation: screen === \"preparation\",\n      isPrivacy: screen === \"privacy\",\n      goToPrivacy: this.goToPrivacy,\n      goBackFromPrivacy: this.goBackFromPrivacy,\n      isSac: screen === \"sac\",\n      goToSac: this.goToSac,\n      goBackFromSac: this.goBackFromSac,\n      ctaRef: this.ctaRef,\n      scrollToCta: this.scrollToCta,\n      securityRef: this.securityRef,\n      legalRef: this.legalRef,\n      securityRevealStyle: `opacity:${this.revealed.security ? 1 : 0};transform:translateY(${this.revealed.security ? 0 : 24}px);transition:opacity .7s ease, transform .7s ease;`,\n      legalRevealStyle: `opacity:${this.revealed.legal ? 1 : 0};transform:translateY(${this.revealed.legal ? 0 : 24}px);transition:opacity .7s ease, transform .7s ease;`,\n      progressBarStyle: { height: \"100%\", background: \"#D4AF37\", borderRadius: \"999px\", transition: \"width .4s ease\", width: progressPct + \"%\" },\n      showFeedback: !!feedback,\n      feedback,\n      count,\n      countdownMessage: COUNTDOWN_MESSAGES[count] || \"\",\n      q1Options: this.makeOptions(\"casa\", Q_DEFS.q1, quiz.casa, \"Resposta registrada ✓\", \"quiz2\"),\n      q2Options: this.makeOptions(\"idadeConta\", Q_DEFS.q2, quiz.idadeConta, \"Perfeito. Falta apenas uma etapa.\", \"quiz3\"),\n      q3Options: this.makeOptions(\"verificacao\", Q_DEFS.q3, quiz.verificacao, \"Tudo certo ✓\", \"qualification\"),\n      goToAgeGate: () => { trackMetaOnce(\"MainCtaClick\"); this.goTo(\"age_gate\"); },\n      confirmAdult: this.confirmAdult,\n      denyAdult: this.denyAdult,\n      underageHasAdult: this.underageHasAdult,\n      underageNoAdult: this.underageNoAdult,\n      startAdultConfirmation: this.startAdultConfirmation,\n      manualRedirect: this.manualRedirect\n    };\n  }\n}\n\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
